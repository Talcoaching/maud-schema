<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schema Maud - Tal&coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2D4A3E;--cream:#FDFBF3;--gold:#C97B1A;--teal:#2A7A8C;
  --muted:#6b7c76;--border:#ddd8cc;--white:#fff;--rose:#9B4F6A;
  --up:#27ae60;--dn:#e74c3c;
}
body{background:var(--cream);font-family:'Nunito',sans-serif;font-size:14px;color:var(--green);min-height:100vh}

/* LOGIN */
#loginScreen{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#loginScreen.show{display:flex}
.lcard{background:var(--white);border-radius:20px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);overflow:hidden}
.lcard-top{background:var(--green);padding:26px 28px 22px;position:relative}
.lcard-top::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--gold),var(--teal))}
.lcard-logo{height:24px;filter:brightness(0) invert(1)}
.lcard-body{padding:28px}
.lcard-title{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:900;color:var(--green);margin-bottom:8px}
.lcard-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.lcard-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'Nunito',sans-serif;font-size:14px;color:var(--green);outline:none;background:var(--cream);margin-bottom:12px}
.lcard-input:focus{border-color:var(--teal);background:#fff}
.lcard-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.lcard-btn:disabled{background:var(--muted);cursor:not-allowed}
.lcard-msg{margin-top:12px;font-size:13px;font-weight:600;min-height:18px;text-align:center}
.lcard-msg.success{color:var(--teal)}
.lcard-msg.error{color:var(--dn)}

/* APP */
#appScreen{display:none}
#appScreen.show{display:block}
.header{background:var(--green);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--gold),var(--teal))}
.header-logo{height:20px;filter:brightness(0) invert(1)}
.header-right{display:flex;align-items:center;gap:8px}
.header-name{font-family:'Fraunces',serif;font-size:.85rem;font-style:italic;color:rgba(255,255,255,.7)}
.sync-status{font-size:10px;font-weight:700;color:rgba(255,255,255,.45)}

.schema-toggle{background:var(--white);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;position:sticky;top:51px;z-index:100}
.schema-btn{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--border);background:var(--cream);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center}
.schema-btn.active{background:var(--green);border-color:var(--green);color:#fff}
.schema-btn .schema-label{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:2px}

.week-nav{background:var(--white);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:99px;z-index:99}
.week-nav::-webkit-scrollbar{display:none}
.week-btn{flex-shrink:0;padding:4px 10px;border-radius:16px;border:1.5px solid var(--border);background:var(--cream);font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.week-btn.active{background:var(--green);border-color:var(--green);color:#fff}
.week-btn.has-data{border-color:var(--teal);color:var(--teal)}

.container{max-width:720px;margin:0 auto;padding:14px 13px 100px}
.week-meta{margin-bottom:12px;padding:0 4px}
.week-label{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:900}
.week-label span{font-style:italic;color:var(--gold)}
.phase-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-top:4px}
.p1{background:#edf2f0;color:var(--green)}
.p2{background:#fdf6ec;color:var(--gold)}
.p3{background:#eef7f9;color:var(--teal)}

.warmup-card{background:var(--green);border-radius:12px;padding:12px 15px;margin-bottom:12px}
.warmup-title{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.warmup-text{font-size:13px;color:rgba(255,255,255,.8)}

.exercise{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.ex-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.ex-name{font-weight:700;font-size:14px;color:var(--green);flex:1}
.ex-tag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-top:2px}
.tag-compound{background:#edf2f0;color:var(--green)}
.tag-isolation{background:#fdf6ec;color:var(--gold)}
.tag-core{background:#eef7f9;color:var(--teal)}
.tag-cardio{background:#fce8ef;color:var(--rose)}
.ex-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.badge-reps{background:#fce8ef;color:var(--rose)}
.badge-prog{background:#fdf6ec;color:var(--gold)}
.ex-note{font-size:11px;color:var(--teal);font-style:italic;padding:5px 8px;background:#eef7f9;border-radius:6px;margin-bottom:7px;line-height:1.5}
.ex-progress{font-size:11px;color:var(--gold);padding:5px 8px;background:#fdf6ec;border-radius:6px;margin-bottom:7px;line-height:1.5}

.set-row{display:grid;gap:4px;align-items:center;margin-bottom:3px}
.col-hdr{font-size:9px;font-weight:800;text-transform:uppercase;color:var(--muted);text-align:center}
.set-num{font-size:11px;color:var(--muted);font-weight:700;text-align:center}
input[type="text"]{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:7px;padding:5px 3px;font-family:'Nunito',sans-serif;font-size:12px;color:var(--green);text-align:center;outline:none}
input[type="text"]:focus{border-color:var(--teal);background:#fff}
input::placeholder{color:#ccc;font-size:10px}

.vol-bar{margin-top:6px;padding:6px 9px;background:var(--cream);border-radius:8px;border:1px solid var(--border)}
.vol-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.vol-num{font-size:11px;font-weight:700}
.vol-diff{font-size:11px;font-weight:700}
.vol-track{height:3px;background:var(--border);border-radius:4px;overflow:hidden}
.vol-fill{height:100%;border-radius:4px;transition:width .3s}

.notes-block{background:#fafaf7;border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:10px}
.notes-label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
textarea{width:100%;background:#fff;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-family:'Nunito',sans-serif;font-size:12px;color:var(--green);outline:none;resize:none;height:48px}
textarea:focus{border-color:var(--teal)}

.save-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:100}
.btn-save{flex:1;background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.save-msg{font-size:12px;color:var(--teal);font-weight:700;display:none;min-width:80px}

@keyframes squat-body{0%,100%{transform:translateY(0)}50%{transform:translateY(28px)}}
@keyframes squat-arm-l{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-30deg)}}
@keyframes squat-arm-r{0%,100%{transform:rotate(0deg)}50%{transform:rotate(30deg)}}
@keyframes hip-thrust-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes abduct-leg{0%,100%{transform:rotate(0deg)}50%{transform:rotate(35deg)}}
@keyframes lunge-down{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
@keyframes kickback-leg{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-50deg)}}
@keyframes jump-sq-body{0%,40%{transform:translateY(0)}60%{transform:translateY(-20px)}100%{transform:translateY(0)}}
@keyframes pushup-body{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes hollow-legs{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-10deg)}}
@keyframes hollow-arms{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jj-arms{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-70deg)}}
@keyframes jj-legs{0%,100%{d:path("M35 95 L30 126")}50%{d:path("M38 95 L22 126")}}
@keyframes mc-leg-l{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-55deg)}}
@keyframes mc-leg-r{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-55deg)}50%,100%{transform:rotate(0deg)}}
@keyframes plank-pushup{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes burpee-body{0%,100%{transform:translateY(0) scaleY(1)}40%{transform:translateY(25px) scaleY(0.7)}70%{transform:translateY(-15px) scaleY(1)}}
@keyframes sideplan-hip{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>

function getPhase(w){
  if(w<=4) return {label:'Fase 1 - Opbouw',cls:'p1'};
  if(w<=8) return {label:'Fase 2 - Opbouw',cls:'p2'};
  return {label:'Fase 3 - Intensiteit',cls:'p3'};
}

function fKey(sk,w,ei,s,t){return `maud_${sk}_w${w}_e${ei}_s${s}_${t}`;}
function nKey(sk,w){return `maud_${sk}_w${w}_notes`;}

async function sbUpsert(row){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/training_sessions',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(row)
    });
  }catch(e){console.warn('sync failed',e);}
}

async function sbLoad(sk,w){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/training_sessions?client=eq.maud_'+sk+'&week=eq.'+w,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    const rows=await r.json();
    if(Array.isArray(rows)) rows.forEach(row=>{
      if(row.weight) localStorage.setItem(fKey(sk,w,row.exercise,row.set_num,'w'),row.weight);
      if(row.reps)   localStorage.setItem(fKey(sk,w,row.exercise,row.set_num,'r'),row.reps);
      if(row.rir)    localStorage.setItem(fKey(sk,w,row.exercise,row.set_num,'rir'),row.rir);
      if(row.notes)  localStorage.setItem(nKey(sk,w),row.notes);
    });
  }catch(e){console.warn('load failed',e);}
}

function getVol(sk,w,ei){
  const ex=SCHEMA[sk].exercises[ei];
  let t=0;
  for(let s=0;s<ex.sets;s++){
    const wv=parseFloat(localStorage.getItem(fKey(sk,w,ei,s,'w')))||0;
    const rv=parseFloat(localStorage.getItem(fKey(sk,w,ei,s,'r')))||0;
    t+=wv*rv;
  }
  return Math.round(t);
}

function getPrev(sk,w,ei){
  for(let pw=w-1;pw>=1;pw--){const v=getVol(sk,pw,ei);if(v>0) return {vol:v,week:pw};}
  return null;
}

function volHTML(sk,ei){
  const cur=getVol(sk,CW,ei);
  const prev=getPrev(sk,CW,ei);
  let diffTxt='Eerste meting',diffColor='var(--muted)';
  if(prev){
    const d=cur-prev.vol;
    if(d>0){diffTxt='+'+d+' kg (w'+prev.week+')';diffColor='var(--up)';}
    else if(d<0){diffTxt=d+' kg (w'+prev.week+')';diffColor='var(--dn)';}
    else diffTxt='Gelijk';
  }
  let maxVol=cur;
  for(let w2=1;w2<=WEEKS;w2++){const v=getVol(sk,w2,ei);if(v>maxVol)maxVol=v;}
  const pct=maxVol>0?Math.round((cur/maxVol)*100):0;
  const barColor=cur===0?'var(--border)':!prev?'var(--teal)':cur>=prev.vol?'var(--up)':'var(--dn)';
  return `<div class="vol-bar"><div class="vol-top"><span class="vol-num">${cur>0?cur+' kg':'Nog invullen'}</span><span class="vol-diff" style="color:${diffColor}">${diffTxt}</span></div><div class="vol-track"><div class="vol-fill" style="width:${pct}%;background:${barColor}"></div></div></div>`;
}

function buildNav(){
  const nav=document.getElementById('weekNav');
  nav.innerHTML='';
  for(let w=1;w<=WEEKS;w++){
    const btn=document.createElement('button');
    btn.className='week-btn'+(w===CW?' active':'');
    let hasData=false;
    SCHEMA[SCHEMA_KEY].exercises.forEach((ex,ei)=>{
      for(let s=0;s<ex.sets;s++) if(localStorage.getItem(fKey(SCHEMA_KEY,w,ei,s,'r'))) hasData=true;
    });
    if(hasData&&w!==CW) btn.classList.add('has-data');
    btn.textContent='W'+w;
    btn.onclick=async()=>{CW=w;await sbLoad(SCHEMA_KEY,w);buildNav();renderWeek();};
    nav.appendChild(btn);
  }
}

function renderWeek(){
  const c=document.getElementById('mainContent');
  const phase=getPhase(CW);
  const sd=SCHEMA[SCHEMA_KEY];
  const circuitBlock = sd.circuit ? `<div class="warmup-card" style="background:var(--rose);margin-bottom:12px"><div class="warmup-title" style="color:#fff">Circuit training</div><div class="warmup-text">${sd.circuitNote}</div></div>` : '';
  c.innerHTML=`<div class="week-meta"><div class="week-label">Week <span>${CW}</span> van ${WEEKS}</div><div class="phase-badge ${phase.cls}">${phase.label}</div></div>
  <div class="warmup-card"><div class="warmup-title">Warming-up</div><div class="warmup-text">${sd.warmup}</div></div>
  ${circuitBlock}`;

  sd.exercises.forEach((ex,ei)=>{
    const isIso=ex.isometric||false;
    const isMax=ex.isMax||false;
    const isSec=ex.isSec||false;
    const noWeight=isIso||isMax||isSec||ex.tag==='cardio';

    let colTpl, hdrHtml;
    if(noWeight){
      colTpl='grid-template-columns:20px 1fr 1fr 44px';
      const midLabel=isIso||isSec?'Sec':'Reps';
      hdrHtml=`<span></span><span class="col-hdr">Set</span><span class="col-hdr">${midLabel}</span><span class="col-hdr">RIR</span>`;
    } else {
      colTpl='grid-template-columns:20px 1fr 1fr 1fr 44px';
      hdrHtml=`<span></span><span class="col-hdr">Set</span><span class="col-hdr">Kg</span><span class="col-hdr">Reps</span><span class="col-hdr">RIR</span>`;
    }

    let rows=`<div class="set-row" style="display:grid;${colTpl};gap:4px;margin-bottom:3px">${hdrHtml}</div>`;

    for(let s=0;s<ex.sets;s++){
      const wVal=localStorage.getItem(fKey(SCHEMA_KEY,CW,ei,s,'w'))||'';
      const rVal=localStorage.getItem(fKey(SCHEMA_KEY,CW,ei,s,'r'))||'';
      const rirVal=localStorage.getItem(fKey(SCHEMA_KEY,CW,ei,s,'rir'))||'';
      const placeholder=isIso||isSec?'sec':'reps';

      rows+=`<div class="set-row" style="display:grid;${colTpl};gap:4px;margin-bottom:3px;align-items:center">
        <div class="set-num">${s+1}</div>
        <div style="font-size:10px;color:var(--muted);text-align:center">set ${s+1}</div>
        ${noWeight
          ?`<input type="text" placeholder="${placeholder}" value="${rVal}" data-ei="${ei}" data-s="${s}" data-t="r" onchange="autoSave(this)">`
          :`<input type="text" placeholder="-" value="${wVal}" data-ei="${ei}" data-s="${s}" data-t="w" oninput="liveUpdate(this)" onchange="autoSave(this)">
            <input type="text" placeholder="-" value="${rVal}" data-ei="${ei}" data-s="${s}" data-t="r" oninput="liveUpdate(this)" onchange="autoSave(this)">`
        }
        <input type="text" placeholder="?" value="${rirVal}" data-ei="${ei}" data-s="${s}" data-t="rir" onchange="autoSave(this)">
      </div>`;
    }

    const showVol=!noWeight;
    c.innerHTML+=`<div class="exercise">
      <div class="ex-top">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-tag tag-${ex.tag}">${ex.tag}</div>
      </div>
      <div class="ex-badges">
        <span class="badge badge-reps">${ex.sets}x ${ex.reps}</span>
        ${ex.progress?`<span class="badge badge-prog">progressie</span>`:''}
      </div>
      ${ex.note?`<div class="ex-note">${ex.note}</div>`:''}
      ${ex.progress&&CW<=8?`<div class="ex-progress">${ex.progress}</div>`:''}
      ${ILLUSTRATIONS[ex.name]||''}
      ${rows}
      ${showVol?`<div id="vol-${ei}">${volHTML(SCHEMA_KEY,ei)}</div>`:''}
    </div>`;
  });

  const savedNotes=localStorage.getItem(nKey(SCHEMA_KEY,CW))||'';
  c.innerHTML+=`<div class="notes-block"><label class="notes-label">Notities</label><textarea placeholder="Hoe voelde het?" onchange="saveNote(this)">${savedNotes}</textarea></div>`;
}

function autoSave(inp){
  localStorage.setItem(fKey(SCHEMA_KEY,CW,parseInt(inp.dataset.ei),parseInt(inp.dataset.s),inp.dataset.t),inp.value);
}
function saveNote(ta){
  localStorage.setItem(nKey(SCHEMA_KEY,CW),ta.value);
}
function liveUpdate(inp){
  autoSave(inp);
  const ei=parseInt(inp.dataset.ei);
  const volEl=document.getElementById('vol-'+ei);
  if(volEl) volEl.innerHTML=volHTML(SCHEMA_KEY,ei);
}

async function saveWeek(){
  const msg=document.getElementById('saveMsg');
  msg.style.display='block';
  msg.textContent='Opslaan...';
  document.querySelectorAll('input[data-ei]').forEach(i=>autoSave(i));
  document.querySelectorAll('textarea').forEach(t=>saveNote(t));
  const promises=[];
  SCHEMA[SCHEMA_KEY].exercises.forEach((ex,ei)=>{
    for(let s=0;s<ex.sets;s++){
      const w=localStorage.getItem(fKey(SCHEMA_KEY,CW,ei,s,'w'))||'';
      const r=localStorage.getItem(fKey(SCHEMA_KEY,CW,ei,s,'r'))||'';
      const rir=localStorage.getItem(fKey(SCHEMA_KEY,CW,ei,s,'rir'))||'';
      if(w||r||rir) promises.push(sbUpsert({client:'maud_'+SCHEMA_KEY,week:CW,day:0,exercise:ei,set_num:s,weight:w,reps:r,rir:rir}));
    }
  });
  const notes=localStorage.getItem(nKey(SCHEMA_KEY,CW))||'';
  if(notes) promises.push(sbUpsert({client:'maud_'+SCHEMA_KEY,week:CW,day:0,exercise:-1,set_num:-1,notes:notes}));
  await Promise.all(promises);
  buildNav();
  msg.textContent='Opgeslagen';
  setTimeout(()=>msg.style.display='none',2500);
}

async function setSchema(key){
  SCHEMA_KEY=key;
  document.getElementById('btnA').classList.toggle('active',key==='A');
  document.getElementById('btnB').classList.toggle('active',key==='B');
  CW=1;
  await sbLoad(key,1);
  buildNav();
  renderWeek();
  window.scrollTo(0,0);
}

let sx=0,sy=0;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',async e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
    if(dx<0&&CW<WEEKS){CW++;await sbLoad(SCHEMA_KEY,CW);buildNav();renderWeek();}
    else if(dx>0&&CW>1){CW--;await sbLoad(SCHEMA_KEY,CW);buildNav();renderWeek();}
  }
},{passive:true});

async function sendMagicLink(){
  const email=document.getElementById('loginEmail').value.trim();
  if(!email){showLoginMsg('Vul een e-mailadres in.','error');return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Versturen...';
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.href}});
  if(error) showLoginMsg('Fout: '+error.message,'error');
  else showLoginMsg('Check je e-mail voor de inloglink!','success');
  btn.disabled=false;btn.textContent='Stuur inloglink';
}
function showLoginMsg(msg,type){
  const el=document.getElementById('loginMsg');
  el.textContent=msg;el.className='lcard-msg '+type;
}
function showApp(){
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').classList.add('show');
}
async function startApp(){
  await sbLoad(SCHEMA_KEY,CW);
  buildNav();
  renderWeek();
  document.getElementById('syncStatus').textContent='gesynchroniseerd';
}
async function checkAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){showApp();await startApp();}
  else document.getElementById('loginScreen').classList.add('show');
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session){showApp();await startApp();}
  });
}

checkAuth();
